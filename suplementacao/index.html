<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Ficha de saúde para suplementação dos pais, da Dra. Sabrina Gois Santos.">
<meta name="robots" content="noindex">
</head>
<body>
<title>Ficha de Suplementação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;600;700&display=swap">

<style>
:root{
  --ground:#FBF6F4;
  --surface:#FFFFFF;
  --surface-2:#F6EDEA;
  --ink:#3B2E27;
  --ink-soft:#7A6960;
  --ink-faint:#A0908A;
  --line:#E7D9D4;
  --accent:#9C6F74;
  --accent-deep:#7E555B;
  --accent-soft:#F7D9D7;
  --on-accent:#FFFFFF;
  --gold:#A77343;
  --ok:#5E7F63;
  --shadow:0 1px 2px rgba(59,46,39,.05), 0 12px 32px -18px rgba(59,46,39,.28);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#19140F;
    --surface:#221B16;
    --surface-2:#2C231D;
    --ink:#F2E8E1;
    --ink-soft:#BFAFA6;
    --ink-faint:#8E7D74;
    --line:#3A2E27;
    --accent:#D7A9AD;
    --accent-deep:#EBC6C8;
    --accent-soft:#3E2C2C;
    --on-accent:#241C17;
    --gold:#C79B6A;
    --ok:#9BBFA0;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#19140F;
  --surface:#221B16;
  --surface-2:#2C231D;
  --ink:#F2E8E1;
  --ink-soft:#BFAFA6;
  --ink-faint:#8E7D74;
  --line:#3A2E27;
  --accent:#D7A9AD;
  --accent-deep:#EBC6C8;
  --accent-soft:#3E2C2C;
  --on-accent:#241C17;
  --gold:#C79B6A;
  --ok:#9BBFA0;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -18px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"Karla","Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}

/* ---------- topo ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:640px;margin:0 auto;padding:14px 20px 10px;
  display:flex;flex-direction:column;gap:9px;
}
.brand{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
}
.brand-name{
  font-family:"Lora",Georgia,"Times New Roman",serif;
  font-size:15px;letter-spacing:.01em;
}
.brand-name span{color:var(--ink-soft);font-family:"Karla",sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-top:1px}
.step-count{
  font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.rail{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.rail-fill{height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}

/* ---------- conteúdo ---------- */
main{max-width:640px;margin:0 auto;padding:26px 20px 120px}

.intro-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 24px;box-shadow:var(--shadow);
}
.intro-card h1{
  font-family:"Lora",Georgia,"Times New Roman",serif;font-weight:600;font-size:30px;line-height:1.15;
  margin:6px 0 12px;text-wrap:balance;
}
.intro-card h1 em{font-style:italic;color:var(--accent-deep)}
.intro-card p{color:var(--ink-soft);margin:0 0 14px}
.eyebrow{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;
}
.intro-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.intro-list li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-soft)}
.intro-list li b{color:var(--ink);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}

.section-head{margin:0 0 20px}
.section-head .kicker{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;
}
.section-head h2{
  font-family:"Lora",Georgia,"Times New Roman",serif;font-weight:600;font-size:25px;line-height:1.2;
  margin:6px 0 6px;text-wrap:balance;
}
.section-head p{margin:0;color:var(--ink-soft);font-size:14.5px}

.fields{display:flex;flex-direction:column;gap:18px}
.field{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px 15px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:9px;
}
.field.invalid{border-color:#C2726F}
label.q{font-weight:600;font-size:15.5px;line-height:1.35;display:block}
label.q .req{color:var(--accent);margin-left:3px}
.hint{font-size:13px;color:var(--ink-faint);margin-top:-4px}

input[type=text],input[type=tel],input[type=email],input[type=date],textarea,select{
  width:100%;font:inherit;color:var(--ink);
  background:var(--surface-2);
  border:1px solid transparent;border-radius:10px;
  padding:11px 12px;outline:none;
  transition:border-color .15s, background .15s;
}
textarea{min-height:96px;resize:vertical;line-height:1.5}
textarea.tall{min-height:150px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--surface)}
input::placeholder,textarea::placeholder{color:var(--ink-faint)}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{
  position:relative;
}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{
  display:block;padding:9px 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);
  font-size:14.5px;cursor:pointer;transition:.15s;
}
.opt input:checked + span{
  background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:600;
}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

.age-chip{
  align-self:flex-start;font-size:13px;color:var(--accent-deep);background:var(--accent-soft);
  border-radius:999px;padding:3px 10px;font-weight:600;
}

.note{
  background:var(--surface-2);border-left:3px solid var(--gold);
  border-radius:0 10px 10px 0;padding:14px 16px;font-size:14.5px;color:var(--ink-soft);
}
.note b{color:var(--ink)}
.note a{color:var(--accent-deep)}

/* ---------- navegação ---------- */
.navbar{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:color-mix(in srgb, var(--ground) 92%, transparent);
  backdrop-filter:saturate(140%) blur(10px);
  border-top:1px solid var(--line);
}
.navbar-inner{max-width:640px;margin:0 auto;padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.btn{
  border:0;border-radius:11px;padding:13px 22px;cursor:pointer;font-weight:600;font-size:15.5px;
  transition:.15s;
}
.btn-primary{background:var(--accent);color:var(--on-accent);flex:1}
.btn-primary:hover{background:var(--accent-deep)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-deep)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.saved{font-size:12px;color:var(--ink-faint);text-align:center;padding-bottom:6px}

/* ---------- revisão ---------- */
.review-group{margin:0 0 22px}
.review-group h3{
  font-family:"Lora",Georgia,"Times New Roman",serif;font-size:17px;font-weight:600;margin:0 0 10px;
  padding-bottom:7px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px;
}
.review-group h3 button{
  background:none;border:0;font-size:12.5px;color:var(--accent);cursor:pointer;font-family:"Karla",sans-serif;font-weight:600;
}
.qa{margin:0 0 12px}
.qa dt{font-size:12.5px;color:var(--ink-faint);letter-spacing:.02em}
.qa dd{margin:2px 0 0;font-size:15px;white-space:pre-wrap}
.empty{color:var(--ink-faint);font-style:italic}

.done{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 24px;box-shadow:var(--shadow);text-align:center;
}
.done h2{font-family:"Lora",Georgia,"Times New Roman",serif;font-weight:600;font-size:26px;margin:10px 0 8px}
.done p{color:var(--ink-soft);margin:0 auto 8px;max-width:44ch}
.mark{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;margin:0 auto}
.mark svg{width:24px;height:24px;stroke:var(--accent-deep);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.status{font-size:13.5px;min-height:20px;color:var(--ink-soft)}
.status.err{color:#C2726F}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){
  .intro-card h1{font-size:26px}
  .section-head h2{font-size:22px}
}

/* ---------- campos condicionais e arquivo ---------- */
.field.follow{margin-top:-8px;border-left:3px solid var(--accent-soft)}
.file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.file-drop{
  display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
  border:1.5px dashed var(--line);border-radius:12px;background:var(--surface-2);
  padding:22px 14px;color:var(--accent-deep);font-weight:600;font-size:15px;transition:.15s;
}
.file-drop:hover{border-color:var(--accent)}
.file-input:focus-visible + .file-drop{outline:2px solid var(--accent);outline-offset:2px}
.file-drop svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.file-chip{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.file-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--accent-deep)}
.file-size{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.file-remove{background:none;border:0;color:var(--accent-deep);font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
.btn:disabled{opacity:.7;cursor:default}
.field .status:empty{display:none}

</style>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-name">Dra. Sabrina Gois Santos<span>Pediatria e Homeopatia</span></div>
      <div class="step-count" id="stepCount"></div>
    </div>
    <div class="rail"><div class="rail-fill" id="railFill"></div></div>
  </div>
</div>

<main id="app"></main>

<div class="navbar" id="navbar">
  <div class="saved" id="savedNote"></div>
  <div class="navbar-inner">
    <button class="btn btn-ghost" id="btnBack" type="button">Voltar</button>
    <button class="btn btn-primary" id="btnNext" type="button">Continuar</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   1. CONTEÚDO DA FICHA (mesmas perguntas do Google Forms)
   ============================================================ */

const SECTIONS = [
  {
    id:"identificacao",
    title:"Seus dados",
    sub:"Para identificar a ficha.",
    fields:[
      {id:"nome", label:"Nome completo", type:"text", required:true, placeholder:"Nome e sobrenome"},
      {id:"nascimento", label:"Data de nascimento", type:"date", required:true, age:true},
      {id:"peso", label:"Peso", type:"text", inputmode:"decimal", placeholder:"Ex.: 68 kg"},
      {id:"estatura", label:"Estatura", type:"text", inputmode:"decimal", placeholder:"Ex.: 1,65 m"}
    ]
  },
  {
    id:"saude",
    title:"Sua saúde",
    sub:"Se responder sim, um campo se abre para você descrever.",
    fields:[
      {id:"doenca", label:"Possui alguma doença prévia?", type:"radio", required:true, options:["Sim","Não"]},
      {id:"doenca_desc", label:"Descreva:", type:"textarea", showIf:{f:"doenca", v:["Sim"]}},
      {id:"alergia", label:"Possui alergia a medicamentos, alimentos ou quaisquer substâncias?", type:"radio", required:true, options:["Sim","Não"]},
      {id:"alergia_desc", label:"Descreva:", type:"textarea", showIf:{f:"alergia", v:["Sim"]}},
      {id:"medicamentos", label:"Faz uso de algum medicamento contínuo, vitaminas, suplementos, homeopatias ou fitoterápicos?", type:"radio", required:true, options:["Sim","Não"]},
      {id:"medicamentos_desc", label:"Descreva:", type:"textarea", showIf:{f:"medicamentos", v:["Sim"]}}
    ]
  },
  {
    id:"habitos",
    title:"Seus hábitos",
    sub:"Alimentação, atividade física e sono.",
    fields:[
      {id:"alimentacao", label:"Descreva sua alimentação diária", type:"textarea", required:true, tall:true},
      {id:"atividade", label:"Faz atividade física regularmente?", type:"radio", required:true, options:["Sim","Não"]},
      {id:"sono", label:"Como é o seu sono?", type:"radio", options:["Bom","Regular","Péssimo"]}
    ]
  },
  {
    id:"documentos",
    title:"Carteirinha e exames",
    sub:"Os arquivos seguem junto com a ficha para a Dra. Sabrina.",
    fields:[
      {id:"carteirinha", label:"Envie sua carteirinha de vacinação", type:"file", max:1,
       hint:"Foto ou PDF."},
      {id:"exames", label:"Envie seus exames", type:"file", max:10,
       hint:"Se já estiverem prontos. Pode anexar vários arquivos, em PDF ou foto."}
    ]
  }
];

const KICKERS = {
  identificacao:"Identificação",
  saude:"Antecedentes",
  habitos:"Hábitos de vida",
  documentos:"Documentos"
};

const LEMBRETES = 'Se seus exames ainda não estiverem prontos, assim que estiverem envie em PDF para o e-mail <b>exames@drasabrina.com.br</b> e em breve retornarei com seu protocolo!';

/* ============================================================
   2. ESTADO
   ============================================================ */

const STORE_KEY = "ficha-suplementacao-pais-v1";
const data = load();
const arquivos = {carteirinha:[], exames:[]};  // {nome, tipo, base64, tamanho} (só na memória)
function todosArquivos(){ return arquivos.carteirinha.concat(arquivos.exames); }
function totalBytes(){ return todosArquivos().reduce((t,a)=>t+a.tamanho,0); }
let step = 0;                                  // 0 = capa
const LAST = SECTIONS.length + 1;              // revisão
const DONE = SECTIONS.length + 2;              // conclusão

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); note("Rascunho salvo neste aparelho"); }
  catch(e){ /* modo privado: segue sem salvar */ }
}
let noteTimer=null;
function note(msg){
  const el = document.getElementById("savedNote");
  el.textContent = msg;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>{ el.textContent=""; }, 2200);
}

/* ============================================================
   3. UTILIDADES
   ============================================================ */

function idadeDe(iso){
  if(!iso) return "";
  const n = new Date(iso+"T00:00:00");
  if(isNaN(n)) return "";
  const h = new Date();
  let anos = h.getFullYear()-n.getFullYear();
  let meses = h.getMonth()-n.getMonth();
  if(h.getDate()-n.getDate()<0){ meses--; }
  if(meses<0){ anos--; meses+=12; }
  if(anos<0 || anos>120) return "";
  return anos+(anos===1?" ano":" anos");
}
function dataBr(iso){
  if(!iso) return "";
  const p = iso.split("-");
  return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : iso;
}
function hojeBr(){
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear();
}
function visible(f){
  if(!f.showIf) return true;
  return f.showIf.v.indexOf(data[f.showIf.f]) !== -1;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function valorDe(f){
  if(f.type === "file") return arquivos[f.id].map(a=>a.nome).join("\n");
  return data[f.id] || "";
}
function respostaFormatada(f){
  let v = valorDe(f);
  if(f.type === "file") return v ? (arquivos[f.id].length > 1 ? "Arquivos anexados:\n" : "Arquivo anexado: ") + v : "";
  if(f.age && idadeDe(v)) return dataBr(v) + " (" + idadeDe(v) + ")";
  if(f.type === "date") return dataBr(v);
  return v;
}
function tamanhoBr(b){
  return b > 1048576 ? (b/1048576).toFixed(1).replace(".",",")+" MB" : Math.max(1,Math.round(b/1024))+" KB";
}

/* ============================================================
   4. RENDER
   ============================================================ */

const app = document.getElementById("app");
const btnBack = document.getElementById("btnBack");
const btnNext = document.getElementById("btnNext");
const railFill = document.getElementById("railFill");
const stepCount = document.getElementById("stepCount");

function render(){
  window.scrollTo(0,0);
  railFill.style.width = Math.round((step / DONE) * 100) + "%";
  document.getElementById("navbar").style.display = (step === DONE) ? "none" : "";

  if(step === 0){ renderCapa(); }
  else if(step <= SECTIONS.length){ renderSecao(SECTIONS[step-1]); }
  else if(step === LAST){ renderRevisao(); }
  else { renderFim(); }
}

function renderCapa(){
  stepCount.textContent = "";
  app.innerHTML =
    '<div class="intro-card">' +
      '<div class="eyebrow">Suplementação dos pais</div>' +
      '<h1>Ficha de saúde para a sua <em>suplementação</em>.</h1>' +
      '<p>São 4 blocos curtos e leva poucos minutos. No último, você já anexa a carteirinha de vacinação e os exames.</p>' +
      '<ul class="intro-list">' +
        '<li><span class="dot"></span><span>Só o que tem <b>*</b> é obrigatório.</span></li>' +
        '<li><span class="dot"></span><span>Suas respostas ficam <b>salvas neste aparelho</b> até o envio, então pode fechar e voltar depois.</span></li>' +
        '<li><span class="dot"></span><span>No fim, a ficha chega direto para a Dra. Sabrina.</span></li>' +
      '</ul>' +
    '</div>';
  btnBack.style.display = "none";
  btnNext.textContent = "Começar";
}

function campoArquivo(f){
  const lista = arquivos[f.id];
  let h = '<input id="i_'+f.id+'" class="file-input" type="file" accept="image/*,application/pdf"'+(f.max>1?' multiple':'')+'>';
  lista.forEach((a,i)=>{
    h += '<div class="file-chip"><span class="file-name">'+esc(a.nome)+'</span>' +
         '<span class="file-size">'+tamanhoBr(a.tamanho)+'</span>' +
         '<button type="button" class="file-remove" data-rm="'+f.id+'" data-i="'+i+'">remover</button></div>';
  });
  if(lista.length < f.max){
    h += '<label for="i_'+f.id+'" class="file-drop"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>' +
         '<span>'+(lista.length ? 'Adicionar outro arquivo' : 'Adicionar arquivo')+'</span></label>';
  }
  h += '<div class="status" id="st_'+f.id+'"></div>';
  return h;
}

function renderSecao(sec){
  stepCount.textContent = "Bloco " + (step) + " de " + SECTIONS.length;
  let html =
    '<div class="section-head">' +
      '<div class="kicker">' + esc(KICKERS[sec.id] || "") + '</div>' +
      '<h2>' + esc(sec.title) + '</h2>' +
      (sec.sub ? '<p>' + esc(sec.sub) + '</p>' : '') +
    '</div><div class="fields">';

  sec.fields.forEach(f=>{
    if(!visible(f)) return;
    html += '<div class="field'+(f.showIf?' follow':'')+'" data-field="'+f.id+'">';
    html += '<label class="q" for="i_'+f.id+'">'+esc(f.label)+(f.required?'<span class="req">*</span>':'')+'</label>';
    if(f.hint) html += '<div class="hint">'+f.hint+'</div>';
    const v = data[f.id] || "";
    if(f.type === "textarea"){
      html += '<textarea id="i_'+f.id+'" class="'+(f.tall?"tall":"")+'" placeholder="'+esc(f.placeholder||"")+'">'+esc(v)+'</textarea>';
    } else if(f.type === "radio"){
      html += '<div class="opts">';
      f.options.forEach((o,i)=>{
        html += '<label class="opt"><input type="radio" name="i_'+f.id+'" value="'+esc(o)+'"'+(v===o?" checked":"")+
                (i===0?' id="i_'+f.id+'"':'')+'><span>'+esc(o)+'</span></label>';
      });
      html += '</div>';
    } else if(f.type === "file"){
      html += campoArquivo(f);
    } else {
      html += '<input id="i_'+f.id+'" type="'+f.type+'" value="'+esc(v)+'" placeholder="'+esc(f.placeholder||"")+'"'+
              (f.inputmode?' inputmode="'+f.inputmode+'"':'')+'>';
    }
    if(f.age) html += '<div class="age-chip" data-age="'+f.id+'" style="display:'+(idadeDe(v)?"block":"none")+'">'+esc(idadeDe(v))+'</div>';
    html += '</div>';
  });

  html += '</div>';
  if(sec.id === "documentos"){
    html += '<div class="note" style="margin-top:18px">'+LEMBRETES+'</div>';
  }
  app.innerHTML = html;
  bind(sec);
  btnBack.style.display = "";
  btnNext.textContent = step === SECTIONS.length ? "Revisar respostas" : "Continuar";
}

function bind(sec){
  sec.fields.forEach(f=>{
    if(!visible(f)) return;
    if(f.type === "radio"){
      app.querySelectorAll('input[name="i_'+f.id+'"]').forEach(inp=>{
        inp.addEventListener("change", ()=>{
          data[f.id] = inp.value; save();
          if(sec.fields.some(x=>x.showIf && x.showIf.f===f.id)){
            renderSecao(sec);
            const alvo = app.querySelector('[data-field="'+f.id+'"]');
            if(alvo) alvo.scrollIntoView({block:"center"});
            const novo = sec.fields.find(x=>x.showIf && x.showIf.f===f.id && visible(x));
            if(novo){ const el = document.getElementById("i_"+novo.id); if(el) el.focus({preventScroll:true}); }
          } else {
            const box = inp.closest(".field"); if(box) box.classList.remove("invalid");
          }
        });
      });
    } else if(f.type === "file"){
      const inp = document.getElementById("i_"+f.id);
      if(inp) inp.addEventListener("change", ()=>{ if(inp.files && inp.files.length) lerArquivos(Array.from(inp.files), f, sec); });
      app.querySelectorAll('[data-rm="'+f.id+'"]').forEach(btn=>{
        btn.addEventListener("click", ()=>{ arquivos[f.id].splice(parseInt(btn.dataset.i,10),1); renderSecao(sec); });
      });
    } else {
      const el = document.getElementById("i_"+f.id);
      if(!el) return;
      el.addEventListener("input", ()=>{
        data[f.id] = el.value;
        const chip = app.querySelector('[data-age="'+f.id+'"]');
        if(chip){
          const t = idadeDe(el.value);
          chip.textContent = t; chip.style.display = t ? "block" : "none";
        }
        el.closest(".field").classList.remove("invalid");
        save();
      });
    }
  });
}

/* ---- leitura dos arquivos (carteirinha e exames) ---- */

const LIMITE_ARQUIVO = 10 * 1024 * 1024;   // por arquivo
const LIMITE_TOTAL   = 18 * 1024 * 1024;   // somando tudo, para caber num e-mail

async function lerArquivos(files, f, sec){
  const st = document.getElementById("st_"+f.id);
  const vagas = f.max - arquivos[f.id].length;
  const erros = [];
  if(files.length > vagas){ erros.push("Cabem no máximo " + f.max + (f.max===1?" arquivo":" arquivos") + " aqui."); files = files.slice(0, vagas); }
  st.className = "status"; st.textContent = "Carregando…";
  for(const file of files){
    const ehImagem = /^image\//.test(file.type);
    const ehPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    if(!ehImagem && !ehPdf){ erros.push(file.name + ": envie foto ou PDF."); continue; }
    if(file.size > LIMITE_ARQUIVO){ erros.push(file.name + ": passou de 10 MB."); continue; }
    try{
      const a = await lerUm(file, ehImagem);
      if(totalBytes() + a.tamanho > LIMITE_TOTAL){
        erros.push(file.name + ": o total de arquivos ficou grande demais. Envie este por e-mail para exames@drasabrina.com.br.");
        continue;
      }
      arquivos[f.id].push(a);
    }catch(e){ erros.push(file.name + ": não consegui ler o arquivo."); }
  }
  renderSecao(sec);
  if(erros.length){
    const st2 = document.getElementById("st_"+f.id);
    st2.className = "status err"; st2.textContent = erros.join(" ");
  }
}

function lerUm(file, ehImagem){
  return new Promise((ok, falha)=>{
    const leitor = new FileReader();
    leitor.onerror = falha;
    leitor.onload = ()=>{
      const dataUrl = String(leitor.result);
      const original = {nome:file.name, tipo:file.type || "application/pdf", base64:dataUrl.split(",")[1], tamanho:file.size};
      if(!ehImagem || /heic|heif/i.test(file.type)){ ok(original); return; }
      // foto: reduz para no máximo 2000 px, mantendo o documento legível
      const img = new Image();
      img.onload = ()=>{
        try{
          const r = Math.min(1, 2000 / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          const b64 = c.toDataURL("image/jpeg", 0.85).split(",")[1];
          const tam = Math.round(b64.length * 0.75);
          if(tam >= file.size){ ok(original); return; }
          ok({nome:file.name.replace(/\.[^.]+$/, "") + ".jpg", tipo:"image/jpeg", base64:b64, tamanho:tam});
        }catch(e){ ok(original); }
      };
      img.onerror = ()=> ok(original);
      img.src = dataUrl;
    };
    leitor.readAsDataURL(file);
  });
}

function validar(sec){
  let ok = true, first = null;
  sec.fields.forEach(f=>{
    if(!f.required || !visible(f)) return;

    if(!val){
      ok = false;
      if(box){ box.classList.add("invalid"); if(!first) first = box; }
    }
  });
  if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
  if(!ok) note("Faltou responder o que está marcado com *");
  return ok;
}

const ENDPOINT = "https://script.google.com/macros/s/AKfycbz4yTCAKp45uCRoCzHnESBlxfP6CeZJ5_5_U1sY8F69XwoUKPmbVMUnl8t-Lbnfx1Il/exec";

function montarEnvio(){
  const blocos = [];
  SECTIONS.forEach(sec=>{
    const respondidos = sec.fields.filter(f=>visible(f) && String(valorDe(f)).trim());
    if(!respondidos.length) return;
    blocos.push({
      titulo: KICKERS[sec.id] || sec.title,
      itens: respondidos.map(f=>({p:f.label, r:respostaFormatada(f)}))
    });
  });
  const envio = {
    tipo:"Suplementação dos pais",
    paciente:{
      nome: data.nome || "",
      idade: idadeDe(data.nascimento),
      nascimento: dataBr(data.nascimento||"")
    },
    blocos: blocos
  };
  const anexos = [];
  arquivos.carteirinha.forEach(a=> anexos.push({nome:"carteirinha-vacinacao-" + nomeBase() + extensao(a), tipo:a.tipo, base64:a.base64}));
  arquivos.exames.forEach((a,i)=> anexos.push({nome:"exames-" + nomeBase() + (arquivos.exames.length>1 ? "-" + (i+1) : "") + extensao(a), tipo:a.tipo, base64:a.base64}));
  if(anexos.length) envio.anexos = anexos;
  return envio;
}
function extensao(a){
  const m = /\.[A-Za-z0-9]+$/.exec(a.nome);
  return m ? m[0].toLowerCase() : (a.tipo === "application/pdf" ? ".pdf" : ".jpg");
}

async function enviarFicha(){
  const st = document.getElementById("status");
  const btn = btnNext;
  st.className = "status";

  btn.disabled = true;
  btn.textContent = "Enviando…";
  const n = todosArquivos().length;
  st.textContent = n ? "Enviando a ficha e " + (n===1 ? "o arquivo" : "os " + n + " arquivos") + ". Pode levar alguns segundos…" : "Enviando a ficha…";

  const corpo = JSON.stringify(montarEnvio());
  try{
    const r = await fetch(ENDPOINT, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: corpo
    });
    const resposta = await r.json();
    if(!resposta.ok) throw new Error(resposta.erro || "falha no servidor");
    // o serviço confirma quantos anexos recebeu; se não confirmar, a família é orientada a mandar por e-mail
    anexoNaoRecebido = n > 0 && !(resposta.anexos >= n);
    concluirEnvio();
  }catch(err){
    try{
      await fetch(ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: corpo});
      anexoNaoRecebido = n > 0;
      concluirEnvio();
    }catch(e2){
      btn.disabled = false;
      btn.textContent = ROTULO_ENVIAR;
      st.className = "status err";
      st.textContent = "Não consegui enviar agora. Verifique a internet e tente de novo.";
    }
  }
}

function concluirEnvio(){
  btnNext.disabled = false;
  btnNext.textContent = ROTULO_ENVIAR;
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  step = DONE;
  render();
}

btnNext.addEventListener("click", ()=>{

const W_REG = {32:278,33:278,34:355,35:556,36:556,37:889,38:667,39:191,40:333,41:333,42:389,43:584,44:278,45:333,46:278,47:278,58:278,59:278,60:584,61:584,62:584,63:556,64:1015,91:278,92:278,93:278,94:469,95:556,96:333,123:334,124:260,125:334,126:584,

 97:556,98:556,99:500,100:556,101:556,102:278,103:556,104:556,105:222,106:222,107:500,108:222,109:833,110:556,111:556,112:556,113:556,114:333,115:500,116:278,117:556,118:500,119:722,120:500,121:500,122:500};
const W_BOLD = {32:278,33:333,34:474,35:556,36:556,37:889,38:722,39:238,40:333,41:333,42:389,43:584,44:278,45:333,46:278,47:278,58:333,59:333,60:584,61:584,62:584,63:611,64:975,91:333,92:278,93:333,94:584,95:556,96:333,123:389,124:280,125:389,126:584,

 97:556,98:611,99:556,100:611,101:556,102:333,103:611,104:611,105:278,106:278,107:556,108:278,109:889,110:611,111:611,112:611,113:611,114:389,115:556,116:333,117:611,118:556,119:778,120:556,121:556,122:500};

for(let c=48;c<=57;c++){ W_REG[c]=556; W_BOLD[c]=556; }

function larguraTexto(str, size, bold){
  const tab = bold ? W_BOLD : W_REG;
  let w = 0;
  for(let i=0;i<str.length;i++){
    const c = str.charCodeAt(i);
    w += (tab[c] !== undefined ? tab[c] : 556);
  }
  return w * size / 1000;
}

function paraLatin1(s){
  return String(s)
    .replace(/[‘’‛]/g,"'")
    .replace(/[“”]/g,'"')
    .replace(/[–—]/g,"-")
    .replace(/…/g,"...")
    .replace(/[^\x00-\xFF]/g,"?");
}
function pdfEsc(s){
  return paraLatin1(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
}
function quebrar(str, size, bold, maxW){
  const linhas = [];
  String(str).split(/\r?\n/).forEach(par=>{
    if(par.trim()===""){ linhas.push(""); return; }
    const palavras = par.split(/\s+/);
    let atual = "";
    palavras.forEach(p=>{
      const teste = atual ? atual+" "+p : p;
      if(larguraTexto(paraLatin1(teste), size, bold) <= maxW){ atual = teste; }
      else{
        if(atual) linhas.push(atual);
        if(larguraTexto(paraLatin1(p), size, bold) > maxW){
          let pedaco = "";
          for(const ch of p){
            if(larguraTexto(paraLatin1(pedaco+ch), size, bold) > maxW){ linhas.push(pedaco); pedaco = ch; }
            else pedaco += ch;
          }
          atual = pedaco;
        } else atual = p;
      }
    });
    if(atual) linhas.push(atual);
  });
  return linhas;
}

function gerarPdf(){
  const PW = 595.28, PH = 841.89;
  const ML = 56, MR = 56, MT = 60, MB = 58;
  const CW = PW - ML - MR;

  const paginas = [];
  let buf = [], y = 0;

  function novaPagina(){
    if(buf.length) paginas.push(buf);
    buf = []; y = PH - MT;
  }
  function rgb(r,g,b){ buf.push(r.toFixed(3)+" "+g.toFixed(3)+" "+b.toFixed(3)+" rg"); }
  function texto(str, size, bold, cor){
    buf.push("BT /"+(bold?"F2":"F1")+" "+size+" Tf 1 0 0 1 "+ML.toFixed(2)+" "+y.toFixed(2)+" Tm ("+pdfEsc(str)+") Tj ET");
  }
  function bloco(str, size, bold, leading, cor){
    const linhas = quebrar(str, size, bold, CW);
    linhas.forEach(l=>{
      if(y < MB + leading){ novaPagina(); }
      if(cor) rgb(cor[0],cor[1],cor[2]);
      if(l !== "") texto(l, size, bold);
      y -= leading;
    });
  }
  function regua(){
    if(y < MB + 12) novaPagina();
    buf.push("0.906 0.851 0.831 RG 0.8 w "+ML.toFixed(2)+" "+y.toFixed(2)+" m "+(PW-MR).toFixed(2)+" "+y.toFixed(2)+" l S");
    y -= 12;
  }
  function espaco(n){ y -= n; }

  novaPagina();

  // cabeçalho
  rgb(0.62,0.44,0.45);
  bloco("DRA. SABRINA GOIS SANTOS  ·  PEDIATRIA E HOMEOPATIA", 8.5, true, 13);
  espaco(11);
  rgb(0.23,0.18,0.15);
  bloco("Ficha de saúde para suplementação", 20, true, 24);
  espaco(2);
  rgb(0.23,0.18,0.15);
  const nome = (data.nome||"-");
  const idade = idadeDe(data.nascimento);
  bloco(nome + (idade ? "   ·   " + idade : ""), 12.5, true, 17);
  rgb(0.48,0.41,0.38);
  const linha2 = [];
  if(data.nascimento) linha2.push("Nascimento: " + dataBr(data.nascimento));
  linha2.push("Preenchida em " + hojeBr());
  bloco(linha2.join("   ·   "), 9, false, 13);
  espaco(6);
  regua();
  espaco(4);

  // corpo
  linhasDaFicha().forEach(item=>{
    if(item.t === "sec"){
      if(y < MB + 115) novaPagina();
      espaco(8);
      rgb(0.62,0.44,0.45);
      bloco(item.v.toUpperCase(), 9, true, 14);
      espaco(1);
      regua();
    } else if(item.t === "q"){
      if(y < MB + 46) novaPagina();
      espaco(4);
      rgb(0.55,0.48,0.44);
      bloco(item.v, 8.5, false, 12);
    } else {
      rgb(0.16,0.13,0.11);
      bloco(item.v, 11, false, 15.5);
      espaco(3);
    }
  });

  novaPagina();

  // rodapé em todas as páginas
  const total = paginas.length;
  paginas.forEach((p,i)=>{
    p.push("0.63 0.57 0.54 rg BT /F1 8 Tf 1 0 0 1 "+ML.toFixed(2)+" "+(MB-22).toFixed(2)+" Tm (" +
           pdfEsc("Ficha de saúde para suplementação · " + (data.nome||"") + " · página " + (i+1) + " de " + total) + ") Tj ET");
  });

  // montagem do arquivo
  const objetos = [];
  const nPag = paginas.length;
  const idPages = 1, idFont1 = 2, idFont2 = 3;
  const idPage = i => 4 + i*2;
  const idCont = i => 5 + i*2;
  const idCatalog = 4 + nPag*2;

  let kids = [];
  for(let i=0;i<nPag;i++) kids.push(idPage(i)+" 0 R");

  objetos[idPages] = "<< /Type /Pages /Count "+nPag+" /Kids ["+kids.join(" ")+"] >>";
  objetos[idFont1] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objetos[idFont2] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  for(let i=0;i<nPag;i++){
    objetos[idPage(i)] = "<< /Type /Page /Parent "+idPages+" 0 R /MediaBox [0 0 "+PW.toFixed(2)+" "+PH.toFixed(2)+"] " +
      "/Resources << /Font << /F1 "+idFont1+" 0 R /F2 "+idFont2+" 0 R >> >> /Contents "+idCont(i)+" 0 R >>";
    const stream = paginas[i].join("\n");
    objetos[idCont(i)] = "<< /Length "+stream.length+" >>\nstream\n"+stream+"\nendstream";
  }
  objetos[idCatalog] = "<< /Type /Catalog /Pages "+idPages+" 0 R >>";

  let pdf = "%PDF-1.4\n";
  const offsets = [];
  for(let i=1;i<objetos.length;i++){
    offsets[i] = pdf.length;
    pdf += i+" 0 obj\n"+objetos[i]+"\nendobj\n";
  }
  const xref = pdf.length;
  pdf += "xref\n0 "+objetos.length+"\n0000000000 65535 f \n";
  for(let i=1;i<objetos.length;i++){
    pdf += String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  }
  pdf += "trailer\n<< /Size "+objetos.length+" /Root "+idCatalog+" 0 R >>\nstartxref\n"+xref+"\n%%EOF";

  const bytes = new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
  return bytes;
}

async function baixarPdf(){
  const st = document.getElementById("status");
  st.className = "status";
  st.textContent = "Montando o PDF…";
  let bytes;
  try{ bytes = gerarPdf(); }
  catch(e){
    st.className = "status err";
    st.textContent = "Não consegui montar o PDF neste aparelho.";
    return;
  }

  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }
  catch(e){ dl = null; }

  if(dl){
    try{
      await dl.save({filename: nomeArquivo(), data: bytes.buffer});
      st.textContent = "PDF salvo.";
      return;
    }catch(err){
      const code = err && err.code;
      if(code === "declined"){ st.textContent = "Download cancelado. Pode tentar de novo quando quiser."; return; }
      /* qualquer outro caso: tenta o caminho do navegador */
    }
  }

  try{
    const blob = new Blob([bytes], {type:"application/pdf"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nomeArquivo();
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    st.textContent = "PDF gerado.";
  }catch(e){
    st.className = "status err";
    st.textContent = "Este navegador bloqueou o download.";
  }
}

render();
})();
</script>

</body>
</html>
